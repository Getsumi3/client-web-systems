<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340">
  <rect width="720" height="340" fill="#1e1e2e"/>

  <text x="360" y="35" text-anchor="middle" fill="#ff6b6b" font-family="monospace" font-size="18" font-weight="bold">useEffect — часті помилки</text>

  <!-- Mistake 1 -->
  <rect x="20" y="55" width="340" height="120" rx="8" fill="#1a1a2e" stroke="#ff6b6b"/>
  <text x="40" y="80" fill="#ff6b6b" font-family="monospace" font-size="13" font-weight="bold">&#10060; 1. Безкінечний цикл</text>
  <text x="40" y="105" fill="#ccc" font-family="monospace" font-size="12">useEffect(() =&gt; {</text>
  <text x="55" y="123" fill="#ccc" font-family="monospace" font-size="12">setCount(count + 1);</text>
  <text x="40" y="141" fill="#ccc" font-family="monospace" font-size="12">}); // без deps!</text>
  <text x="40" y="165" fill="#ff6b6b" font-family="monospace" font-size="11">setCount &#8594; re-render &#8594; effect &#8594; setCount...</text>

  <!-- Mistake 2 -->
  <rect x="380" y="55" width="320" height="120" rx="8" fill="#1a1a2e" stroke="#ff6b6b"/>
  <text x="400" y="80" fill="#ff6b6b" font-family="monospace" font-size="13" font-weight="bold">&#10060; 2. Пропущений dep</text>
  <text x="400" y="105" fill="#ccc" font-family="monospace" font-size="12">useEffect(() =&gt; {</text>
  <text x="415" y="123" fill="#ccc" font-family="monospace" font-size="12">fetch(`/api?q=${query}`);</text>
  <text x="400" y="141" fill="#ccc" font-family="monospace" font-size="12">}, []); // query &#10005;</text>
  <text x="400" y="165" fill="#ff6b6b" font-family="monospace" font-size="11">stale closure — query залишиться старим</text>

  <!-- Mistake 3 -->
  <rect x="20" y="195" width="340" height="120" rx="8" fill="#1a1a2e" stroke="#ff6b6b"/>
  <text x="40" y="220" fill="#ff6b6b" font-family="monospace" font-size="13" font-weight="bold">&#10060; 3. Немає cleanup</text>
  <text x="40" y="245" fill="#ccc" font-family="monospace" font-size="12">useEffect(() =&gt; {</text>
  <text x="55" y="263" fill="#ccc" font-family="monospace" font-size="12">window.addEventListener("resize", handler);</text>
  <text x="55" y="281" fill="#ccc" font-family="monospace" font-size="12">// forgot removeEventListener</text>
  <text x="40" y="299" fill="#ccc" font-family="monospace" font-size="12">}, []);</text>
  <text x="40" y="315" fill="#ff6b6b" font-family="monospace" font-size="11">memory leak при unmount</text>

  <!-- Mistake 4 -->
  <rect x="380" y="195" width="320" height="120" rx="8" fill="#1a1a2e" stroke="#ff6b6b"/>
  <text x="400" y="220" fill="#ff6b6b" font-family="monospace" font-size="13" font-weight="bold">&#10060; 4. Effect для обчислень</text>
  <text x="400" y="245" fill="#ccc" font-family="monospace" font-size="12">useEffect(() =&gt; {</text>
  <text x="415" y="263" fill="#ccc" font-family="monospace" font-size="12">setFiltered(items.filter(...));</text>
  <text x="400" y="281" fill="#ccc" font-family="monospace" font-size="12">}, [items]);</text>
  <text x="400" y="305" fill="#51cf66" font-family="monospace" font-size="11">&#9989; краще: const filtered = useMemo(...)</text>
</svg>