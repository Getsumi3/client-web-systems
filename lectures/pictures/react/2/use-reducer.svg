<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420">
  <rect width="720" height="420" fill="#1e1e2e"/>

  <text x="360" y="35" text-anchor="middle" fill="#d19a66" font-family="monospace" font-size="18" font-weight="bold">useReducer — для складного state</text>

  <!-- useState -->
  <rect x="20" y="60" width="330" height="160" rx="8" fill="#1a1a2e" stroke="#4a9eff"/>
  <text x="40" y="85" fill="#4a9eff" font-family="monospace" font-size="14" font-weight="bold">useState — простий стан</text>
  <text x="40" y="110" fill="#ccc" font-family="monospace" font-size="12">function Counter() {</text>
  <text x="55" y="128" fill="#ccc" font-family="monospace" font-size="12">const [count, setCount] = useState(0);</text>
  <text x="55" y="146" fill="#ccc" font-family="monospace" font-size="12">const reset = () =&gt; setCount(0);</text>
  <text x="55" y="164" fill="#ccc" font-family="monospace" font-size="12">const inc = () =&gt; setCount(c =&gt; c + 1);</text>
  <text x="55" y="182" fill="#ccc" font-family="monospace" font-size="12">const dec = () =&gt; setCount(c =&gt; c - 1);</text>
  <text x="40" y="200" fill="#ccc" font-family="monospace" font-size="12">}</text>

  <!-- useReducer -->
  <rect x="370" y="60" width="330" height="160" rx="8" fill="#1a1a2e" stroke="#d19a66"/>
  <text x="390" y="85" fill="#d19a66" font-family="monospace" font-size="14" font-weight="bold">useReducer — складний стан</text>
  <text x="390" y="110" fill="#ccc" font-family="monospace" font-size="12">function reducer(state, action) {</text>
  <text x="405" y="128" fill="#ccc" font-family="monospace" font-size="12">switch(action.type) {</text>
  <text x="420" y="146" fill="#ccc" font-family="monospace" font-size="12">case "inc": return {count: state.count+1};</text>
  <text x="420" y="164" fill="#ccc" font-family="monospace" font-size="12">case "dec": return {count: state.count-1};</text>
  <text x="420" y="182" fill="#ccc" font-family="monospace" font-size="12">case "reset": return {count: 0};</text>
  <text x="405" y="200" fill="#ccc" font-family="monospace" font-size="12">}}</text>

  <!-- When to use -->
  <rect x="20" y="240" width="330" height="160" rx="8" fill="#2a2a3e" stroke="#51cf66"/>
  <text x="40" y="265" fill="#51cf66" font-family="monospace" font-size="14" font-weight="bold">&#9989; useState коли:</text>
  <text x="40" y="290" fill="#ccc" font-family="monospace" font-size="13">- 1-2 незалежних значень</text>
  <text x="40" y="310" fill="#ccc" font-family="monospace" font-size="13">- прості типи (string, number, bool)</text>
  <text x="40" y="330" fill="#ccc" font-family="monospace" font-size="13">- нескладна логіка оновлення</text>
  <text x="40" y="365" fill="#888" font-family="monospace" font-size="12">toggle, input value, counter</text>

  <rect x="370" y="240" width="330" height="160" rx="8" fill="#2a2a3e" stroke="#ff6b6b"/>
  <text x="390" y="265" fill="#ff6b6b" font-family="monospace" font-size="14" font-weight="bold">&#9989; useReducer коли:</text>
  <text x="390" y="290" fill="#ccc" font-family="monospace" font-size="13">- кілька пов'язаних значень</text>
  <text x="390" y="310" fill="#ccc" font-family="monospace" font-size="13">- наступний стан залежить від попереднього</text>
  <text x="390" y="330" fill="#ccc" font-family="monospace" font-size="13">- складна логіка оновлення</text>
  <text x="390" y="350" fill="#ccc" font-family="monospace" font-size="13">- потрібна тестованість логіки</text>
  <text x="390" y="380" fill="#888" font-family="monospace" font-size="12">forms, multi-step wizards, cart</text>
</svg>