<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380">
  <rect width="720" height="380" fill="#1e1e2e"/>

  <text x="360" y="35" text-anchor="middle" fill="#61DAFB" font-family="monospace" font-size="18" font-weight="bold">Валідація — коли перевіряти</text>

  <!-- On submit -->
  <rect x="20" y="55" width="220" height="180" rx="8" fill="#1a1a2e" stroke="#d19a66"/>
  <text x="40" y="80" fill="#d19a66" font-family="monospace" font-size="13" font-weight="bold">1. On Submit</text>
  <text x="40" y="105" fill="#ccc" font-family="monospace" font-size="12">handleSubmit = (e) =&gt; {</text>
  <text x="55" y="123" fill="#ccc" font-family="monospace" font-size="12">e.preventDefault();</text>
  <text x="55" y="141" fill="#d19a66" font-family="monospace" font-size="12">const errors = validate(form);</text>
  <text x="55" y="159" fill="#d19a66" font-family="monospace" font-size="12">if (Object.keys(errors).length)</text>
  <text x="65" y="177" fill="#d19a66" font-family="monospace" font-size="12">return setErrors(errors);</text>
  <text x="55" y="195" fill="#ccc" font-family="monospace" font-size="12">submit(form);</text>
  <text x="40" y="213" fill="#ccc" font-family="monospace" font-size="12">}</text>
  <text x="40" y="230" fill="#888" font-family="monospace" font-size="10">// всі помилки одразу</text>

  <!-- On change -->
  <rect x="260" y="55" width="220" height="180" rx="8" fill="#1a1a2e" stroke="#4a9eff"/>
  <text x="280" y="80" fill="#4a9eff" font-family="monospace" font-size="13" font-weight="bold">2. On Change (live)</text>
  <text x="280" y="105" fill="#ccc" font-family="monospace" font-size="12">handleChange = (e) =&gt; {</text>
  <text x="295" y="123" fill="#ccc" font-family="monospace" font-size="12">const { name, value } = e.target;</text>
  <text x="295" y="141" fill="#ccc" font-family="monospace" font-size="12">setForm(f =&gt; ({...f, [name]: value}));</text>
  <text x="295" y="159" fill="#4a9eff" font-family="monospace" font-size="12">const err = validateField(name, value);</text>
  <text x="295" y="177" fill="#4a9eff" font-family="monospace" font-size="12">setErrors(e =&gt; ({...e, [name]: err}));</text>
  <text x="280" y="195" fill="#ccc" font-family="monospace" font-size="12">}</text>
  <text x="280" y="230" fill="#888" font-family="monospace" font-size="10">// помилки одразу при введенні</text>

  <!-- On blur -->
  <rect x="500" y="55" width="200" height="180" rx="8" fill="#1a1a2e" stroke="#51cf66"/>
  <text x="520" y="80" fill="#51cf66" font-family="monospace" font-size="13" font-weight="bold">3. On Blur (recommended)</text>
  <text x="520" y="105" fill="#ccc" font-family="monospace" font-size="12">handleBlur = (e) =&gt; {</text>
  <text x="535" y="123" fill="#ccc" font-family="monospace" font-size="12">const { name, value } = e.target;</text>
  <text x="535" y="141" fill="#51cf66" font-family="monospace" font-size="12">const err = validateField(name, value);</text>
  <text x="535" y="159" fill="#51cf66" font-family="monospace" font-size="12">setErrors(e =&gt; ({...e, [name]: err}));</text>
  <text x="520" y="177" fill="#ccc" font-family="monospace" font-size="12">}</text>
  <text x="520" y="215" fill="#888" font-family="monospace" font-size="10">// помилки коли поле</text>
  <text x="520" y="230" fill="#888" font-family="monospace" font-size="10">// втратило фокус</text>

  <!-- Best approach -->
  <rect x="20" y="260" width="680" height="100" rx="8" fill="#2a2a3e" stroke="#61DAFB"/>
  <text x="360" y="285" text-anchor="middle" fill="#61DAFB" font-family="monospace" font-size="15" font-weight="bold">Recommended approach</text>
  <text x="40" y="315" fill="#ccc" font-family="monospace" font-size="13">1. onBlur &#8594; validate field when user leaves input  (no annoying errors while typing)</text>
  <text x="40" y="340" fill="#ccc" font-family="monospace" font-size="13">2. onChange &#8594; clear error when user starts fixing    3. onSubmit &#8594; validate all fields before submit</text>
</svg>