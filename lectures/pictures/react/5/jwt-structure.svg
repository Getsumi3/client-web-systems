<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420">
  <rect width="720" height="420" fill="#1e1e2e"/>

  <text x="360" y="35" text-anchor="middle" fill="#61DAFB" font-family="monospace" font-size="18" font-weight="bold">JWT (JSON Web Token) — структура</text>

  <!-- Token visualization -->
  <rect x="20" y="60" width="680" height="45" rx="6" fill="#2a2a3e" stroke="#444"/>
  <text x="40" y="88" fill="#d19a66" font-family="monospace" font-size="11">eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9</text>
  <text x="350" y="88" fill="#4a9eff" font-family="monospace" font-size="11">.eyJ1c2VyIjp7ImlkIjoiNDIiLCJyb2xlIjoiYWRtaW4ifSwiZXhwIjoxNzAwMH0</text>
  <text x="660" y="88" fill="#51cf66" font-family="monospace" font-size="11">.SflKxwRJSMeKKF2QT4f</text>

  <line x1="280" y1="105" x2="140" y2="135" stroke="#d19a66" stroke-width="2"/>
  <line x1="460" y1="105" x2="360" y2="135" stroke="#4a9eff" stroke-width="2"/>
  <line x1="680" y1="105" x2="580" y2="135" stroke="#51cf66" stroke-width="2"/>

  <!-- Header -->
  <rect x="40" y="135" width="200" height="100" rx="8" fill="#1a1a2e" stroke="#d19a66"/>
  <text x="140" y="160" text-anchor="middle" fill="#d19a66" font-family="monospace" font-size="14" font-weight="bold">HEADER</text>
  <text x="55" y="185" fill="#ccc" font-family="monospace" font-size="11">&#123;</text>
  <text x="65" y="200" fill="#ccc" font-family="monospace" font-size="11">"alg": "HS256",</text>
  <text x="65" y="215" fill="#ccc" font-family="monospace" font-size="11">"typ": "JWT"</text>
  <text x="55" y="230" fill="#ccc" font-family="monospace" font-size="11">&#125;</text>

  <!-- Payload -->
  <rect x="260" y="135" width="200" height="100" rx="8" fill="#1a1a2e" stroke="#4a9eff"/>
  <text x="360" y="160" text-anchor="middle" fill="#4a9eff" font-family="monospace" font-size="14" font-weight="bold">PAYLOAD</text>
  <text x="275" y="185" fill="#ccc" font-family="monospace" font-size="11">&#123;</text>
  <text x="285" y="200" fill="#ccc" font-family="monospace" font-size="11">"user": &#123;id, role&#125;,</text>
  <text x="285" y="215" fill="#ccc" font-family="monospace" font-size="11">"exp": 1700000000</text>
  <text x="275" y="230" fill="#ccc" font-family="monospace" font-size="11">&#125;</text>

  <!-- Signature -->
  <rect x="480" y="135" width="200" height="100" rx="8" fill="#1a1a2e" stroke="#51cf66"/>
  <text x="580" y="160" text-anchor="middle" fill="#51cf66" font-family="monospace" font-size="14" font-weight="bold">SIGNATURE</text>
  <text x="495" y="185" fill="#ccc" font-family="monospace" font-size="11">HMACSHA256(</text>
  <text x="505" y="200" fill="#ccc" font-family="monospace" font-size="11">base64(header) +</text>
  <text x="505" y="215" fill="#ccc" font-family="monospace" font-size="11">base64(payload),</text>
  <text x="505" y="230" fill="#ccc" font-family="monospace" font-size="11">SECRET_KEY)</text>

  <!-- Properties -->
  <rect x="20" y="260" width="680" height="145" rx="8" fill="#2a2a3e" stroke="#444"/>
  <text x="40" y="285" fill="#61DAFB" font-family="monospace" font-size="14" font-weight="bold">Властивості JWT:</text>
  <text x="40" y="310" fill="#ccc" font-family="monospace" font-size="13">+ Stateless &#8212; server не зберігає сесію, token містить усі дані</text>
  <text x="40" y="335" fill="#ccc" font-family="monospace" font-size="13">+ Self-contained &#8212; user id, role, exp всередині payload</text>
  <text x="40" y="360" fill="#ccc" font-family="monospace" font-size="13">+ Підпис &#8212; server перевіряє signature, token не можна підробити</text>
  <text x="40" y="385" fill="#ff6b6b" font-family="monospace" font-size="13">- Payload не зашифрований (лише base64) &#8212; не клади туди секрети!</text>
</svg>