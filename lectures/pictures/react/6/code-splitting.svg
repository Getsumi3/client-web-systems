<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340">
  <rect width="720" height="340" fill="#1e1e2e"/>

  <text x="360" y="35" text-anchor="middle" fill="#61DAFB" font-family="monospace" font-size="18" font-weight="bold">Code Splitting — зменшення bundle</text>

  <!-- Route splitting -->
  <rect x="20" y="55" width="220" height="130" rx="8" fill="#1a1a2e" stroke="#4a9eff"/>
  <text x="40" y="80" fill="#4a9eff" font-family="monospace" font-size="13" font-weight="bold">1. Route splitting</text>
  <text x="40" y="105" fill="#ccc" font-family="monospace" font-size="11">const Home = lazy(</text>
  <text x="50" y="120" fill="#ccc" font-family="monospace" font-size="11">() =&gt; import("./Home")</text>
  <text x="40" y="135" fill="#ccc" font-family="monospace" font-size="11">)</text>
  <text x="40" y="165" fill="#888" font-family="monospace" font-size="10">Each route = separate chunk</text>
  <text x="40" y="180" fill="#888" font-family="monospace" font-size="10">loaded on navigation</text>

  <!-- Component splitting -->
  <rect x="260" y="55" width="220" height="130" rx="8" fill="#1a1a2e" stroke="#d19a66"/>
  <text x="280" y="80" fill="#d19a66" font-family="monospace" font-size="13" font-weight="bold">2. Component splitting</text>
  <text x="280" y="105" fill="#ccc" font-family="monospace" font-size="11">const Modal = lazy(</text>
  <text x="290" y="120" fill="#ccc" font-family="monospace" font-size="11">() =&gt; import("./Modal")</text>
  <text x="280" y="135" fill="#ccc" font-family="monospace" font-size="11">)</text>
  <text x="280" y="165" fill="#888" font-family="monospace" font-size="10">Heavy components loaded</text>
  <text x="280" y="180" fill="#888" font-family="monospace" font-size="10">on demand (modal, chart)</text>

  <!-- Vendor splitting -->
  <rect x="500" y="55" width="200" height="130" rx="8" fill="#1a1a2e" stroke="#51cf66"/>
  <text x="520" y="80" fill="#51cf66" font-family="monospace" font-size="13" font-weight="bold">3. Vendor splitting</text>
  <text x="520" y="105" fill="#ccc" font-family="monospace" font-size="11">// vite.config.ts</text>
  <text x="520" y="123" fill="#ccc" font-family="monospace" font-size="11">manualChunks: {</text>
  <text x="530" y="140" fill="#d19a66" font-family="monospace" font-size="11">react: ["react",</text>
  <text x="540" y="155" fill="#d19a66" font-family="monospace" font-size="11">"react-dom"]</text>
  <text x="520" y="170" fill="#ccc" font-family="monospace" font-size="11">}</text>
  <text x="520" y="180" fill="#888" font-family="monospace" font-size="10">Libs cached separately</text>

  <!-- Bundle analysis -->
  <rect x="20" y="205" width="680" height="120" rx="8" fill="#2a2a3e" stroke="#444"/>
  <text x="40" y="230" fill="#61DAFB" font-family="monospace" font-size="14" font-weight="bold">Bundle analysis tools:</text>
  <text x="40" y="255" fill="#ccc" font-family="monospace" font-size="13">vite-bundle-visualizer / webpack-bundle-analyzer &#8212; see what's inside your bundle</text>
  <text x="40" y="280" fill="#ccc" font-family="monospace" font-size="13">Lighthouse &#8212; measure Performance score, LCP, TBT, CLS</text>
  <text x="40" y="305" fill="#888" font-family="monospace" font-size="12">Target: first load JS &lt; 200KB gzipped | LCP &lt; 2.5s | INP &lt; 200ms</text>
</svg>