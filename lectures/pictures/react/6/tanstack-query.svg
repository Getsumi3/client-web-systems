<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460">
  <rect width="720" height="460" fill="#1e1e2e"/>

  <text x="360" y="35" text-anchor="middle" fill="#61DAFB" font-family="monospace" font-size="18" font-weight="bold">TanStack Query — як це працює</text>

  <!-- Component -->
  <rect x="220" y="55" width="280" height="50" rx="8" fill="#4a9eff"/>
  <text x="360" y="85" text-anchor="middle" fill="#fff" font-family="monospace" font-size="14" font-weight="bold">Component: useQuery()</text>

  <line x1="360" y1="105" x2="360" y2="135" stroke="#888" stroke-width="2" marker-end="url(#q1)"/>

  <!-- Query Cache -->
  <rect x="100" y="135" width="520" height="80" rx="8" fill="#d19a66"/>
  <text x="360" y="160" text-anchor="middle" fill="#1e1e2e" font-family="monospace" font-size="14" font-weight="bold">Query Cache (shared, in-memory)</text>
  <text x="360" y="185" text-anchor="middle" fill="#1e1e2e" font-family="monospace" font-size="12">key: ["users"]  |  key: ["user", "42"]  |  key: ["products", &#123;page:2&#125;]</text>
  <text x="360" y="205" text-anchor="middle" fill="#1e1e2e" font-family="monospace" font-size="11">data, status, fetching, lastUpdated, observers</text>

  <line x1="360" y1="215" x2="360" y2="245" stroke="#888" stroke-width="2" marker-end="url(#q1)"/>

  <!-- Fetcher -->
  <rect x="220" y="245" width="280" height="50" rx="8" fill="#51cf66"/>
  <text x="360" y="275" text-anchor="middle" fill="#1e1e2e" font-family="monospace" font-size="13" font-weight="bold">fetcher function &#8594; axios.get("/api/users")</text>

  <line x1="360" y1="295" x2="360" y2="325" stroke="#888" stroke-width="2" marker-end="url(#q1)"/>

  <!-- Server -->
  <rect x="220" y="325" width="280" height="45" rx="8" fill="#ff6b6b"/>
  <text x="360" y="353" text-anchor="middle" fill="#fff" font-family="monospace" font-size="14" font-weight="bold">Backend REST API</text>

  <!-- Features -->
  <rect x="20" y="390" width="680" height="55" rx="8" fill="#2a2a3e" stroke="#444"/>
  <text x="40" y="412" fill="#51cf66" font-family="monospace" font-size="12">+ cache  + dedup  + refetch on focus  + refetch on reconnect  + stale-while-revalidate</text>
  <text x="40" y="432" fill="#51cf66" font-family="monospace" font-size="12">+ pagination  + infinite scroll  + optimistic  + prefetch  + invalidation  + retry</text>

  <defs>
    <marker id="q1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>
</svg>