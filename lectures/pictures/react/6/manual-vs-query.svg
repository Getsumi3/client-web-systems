<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380">
  <rect width="720" height="380" fill="#1e1e2e"/>

  <text x="360" y="35" text-anchor="middle" fill="#61DAFB" font-family="monospace" font-size="18" font-weight="bold">Ручний CRUD vs TanStack Query</text>

  <!-- Manual -->
  <rect x="20" y="55" width="340" height="310" rx="8" fill="#1a1a2e" stroke="#ff6b6b"/>
  <text x="40" y="80" fill="#ff6b6b" font-family="monospace" font-size="14" font-weight="bold">Ручний (useState + useEffect)</text>
  <text x="40" y="105" fill="#ccc" font-family="monospace" font-size="11">const [users, setUsers] = useState()</text>
  <text x="40" y="123" fill="#ccc" font-family="monospace" font-size="11">const [loading, setLoading] = useState()</text>
  <text x="40" y="141" fill="#ccc" font-family="monospace" font-size="11">const [error, setError] = useState()</text>
  <text x="40" y="165" fill="#ccc" font-family="monospace" font-size="11">useEffect(() =&gt; {</text>
  <text x="55" y="183" fill="#ccc" font-family="monospace" font-size="11">fetch(...).then(setUsers)</text>
  <text x="40" y="201" fill="#ccc" font-family="monospace" font-size="11">}, [])</text>
  <text x="40" y="225" fill="#ff6b6b" font-family="monospace" font-size="11">&#10060; no cache (refetch on every mount)</text>
  <text x="40" y="243" fill="#ff6b6b" font-family="monospace" font-size="11">&#10060; no dedup (2 components = 2 fetch)</text>
  <text x="40" y="261" fill="#ff6b6b" font-family="monospace" font-size="11">&#10060; no refetch on focus/reconnect</text>
  <text x="40" y="279" fill="#ff6b6b" font-family="monospace" font-size="11">&#10060; manual refetch after mutation</text>
  <text x="40" y="297" fill="#ff6b6b" font-family="monospace" font-size="11">&#10060; no pagination/infinite helpers</text>
  <text x="40" y="315" fill="#ff6b6b" font-family="monospace" font-size="11">&#10060; race conditions to handle</text>
  <text x="40" y="333" fill="#ff6b6b" font-family="monospace" font-size="11">&#10060; no prefetch, no optimistic</text>
  <text x="40" y="355" fill="#888" font-family="monospace" font-size="11">~50 lines of boilerplate per query</text>

  <!-- TanStack -->
  <rect x="380" y="55" width="320" height="310" rx="8" fill="#1a1a2e" stroke="#51cf66"/>
  <text x="400" y="80" fill="#51cf66" font-family="monospace" font-size="14" font-weight="bold">TanStack Query</text>
  <text x="400" y="105" fill="#ccc" font-family="monospace" font-size="11">const { data, isLoading, error }</text>
  <text x="415" y="123" fill="#ccc" font-family="monospace" font-size="11">= useQuery({</text>
  <text x="430" y="141" fill="#d19a66" font-family="monospace" font-size="11">queryKey: ["users"],</text>
  <text x="430" y="159" fill="#d19a66" font-family="monospace" font-size="11">queryFn: () =&gt; api.getUsers()</text>
  <text x="415" y="177" fill="#ccc" font-family="monospace" font-size="11">})</text>
  <text x="400" y="201" fill="#51cf66" font-family="monospace" font-size="11">&#9989; automatic cache + dedup</text>
  <text x="400" y="219" fill="#51cf66" font-family="monospace" font-size="11">&#9989; refetch on focus/reconnect</text>
  <text x="400" y="237" fill="#51cf66" font-family="monospace" font-size="11">&#9989; invalidation after mutation</text>
  <text x="400" y="255" fill="#51cf66" font-family="monospace" font-size="11">&#9989; pagination, infinite scroll</text>
  <text x="400" y="273" fill="#51cf66" font-family="monospace" font-size="11">&#9989; prefetch, optimistic updates</text>
  <text x="400" y="291" fill="#51cf66" font-family="monospace" font-size="11">&#9989; retry, rollback on error</text>
  <text x="400" y="309" fill="#51cf66" font-family="monospace" font-size="11">&#9989; DevTools, no race conditions</text>
  <text x="400" y="340" fill="#888" font-family="monospace" font-size="11">~3 lines of code per query</text>
  <text x="400" y="358" fill="#888" font-family="monospace" font-size="11">useMutation + invalidateQueries</text>
</svg>