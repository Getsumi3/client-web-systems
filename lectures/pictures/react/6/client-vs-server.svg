<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420">
  <rect width="720" height="420" fill="#1e1e2e"/>

  <text x="360" y="35" text-anchor="middle" fill="#61DAFB" font-family="monospace" font-size="18" font-weight="bold">Client State vs Server State</text>

  <!-- Client -->
  <rect x="20" y="55" width="330" height="220" rx="8" fill="#1a1a2e" stroke="#4a9eff"/>
  <text x="40" y="80" fill="#4a9eff" font-family="monospace" font-size="15" font-weight="bold">Client State</text>
  <text x="40" y="110" fill="#ccc" font-family="monospace" font-size="13">&#128230; Lives in browser memory</text>
  <text x="40" y="135" fill="#ccc" font-family="monospace" font-size="13">&#9889; Synchronous (instant)</text>
  <text x="40" y="160" fill="#ccc" font-family="monospace" font-size="13">&#128337; Short-lived (UI session)</text>
  <text x="40" y="185" fill="#ccc" font-family="monospace" font-size="13">&#128274; Owned by the app</text>
  <text x="40" y="210" fill="#ccc" font-family="monospace" font-size="13">&#10060; No cache, no invalidation</text>
  <text x="40" y="240" fill="#888" font-family="monospace" font-size="12">Examples: UI toggles, theme,</text>
  <text x="40" y="258" fill="#888" font-family="monospace" font-size="12">form draft, sidebar open, filters</text>
  <text x="40" y="278" fill="#4a9eff" font-family="monospace" font-size="12">Tools: useState, Zustand, Jotai</text>

  <!-- Server -->
  <rect x="370" y="55" width="330" height="220" rx="8" fill="#1a1a2e" stroke="#ff6b6b"/>
  <text x="390" y="80" fill="#ff6b6b" font-family="monospace" font-size="15" font-weight="bold">Server State</text>
  <text x="390" y="110" fill="#ccc" font-family="monospace" font-size="13">&#128268; Lives on the server (DB)</text>
  <text x="390" y="135" fill="#ccc" font-family="monospace" font-size="13">&#9203; Asynchronous (fetch)</text>
  <text x="390" y="160" fill="#ccc" font-family="monospace" font-size="13">&#128338; Long-lived, shared</text>
  <text x="390" y="185" fill="#ccc" font-family="monospace" font-size="13">&#128279; Owned by the server</text>
  <text x="390" y="210" fill="#ccc" font-family="monospace" font-size="13">&#9989; Needs cache + invalidation</text>
  <text x="390" y="240" fill="#888" font-family="monospace" font-size="12">Examples: users list, product,</text>
  <text x="390" y="258" fill="#888" font-family="monospace" font-size="12">orders, search results, profile</text>
  <text x="390" y="278" fill="#ff6b6b" font-family="monospace" font-size="12">Tools: TanStack Query, SWR, RTK Query</text>

  <!-- Why different -->
  <rect x="20" y="295" width="680" height="105" rx="8" fill="#2a2a3e" stroke="#61DAFB"/>
  <text x="40" y="320" fill="#61DAFB" font-family="monospace" font-size="14" font-weight="bold">Чому розділяти?</text>
  <text x="40" y="345" fill="#ccc" font-family="monospace" font-size="13">Server state may be stale &#8212; another user changed data on server, your cache is outdated</text>
  <text x="40" y="365" fill="#ccc" font-family="monospace" font-size="13">Server state needs: caching, refetch, invalidation, optimistic updates, pagination, dedup</text>
  <text x="40" y="385" fill="#888" font-family="monospace" font-size="12">useState/Zustand &#8212; not built for this. TanStack Query handles it automatically.</text>
</svg>