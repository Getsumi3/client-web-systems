<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360">
  <rect width="720" height="360" fill="#1e1e2e"/>

  <text x="360" y="35" text-anchor="middle" fill="#61DAFB" font-family="monospace" font-size="18" font-weight="bold">State Management — огляд інструментів</text>

  <table xmlns="http://www.w3.org/2000/svg" font-family="monospace" font-size="13">
    <rect x="20" y="55" width="160" height="40" fill="#273c66"/>
    <text x="100" y="80" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">Tool</text>
    <rect x="180" y="55" width="140" height="40" fill="#273c66"/>
    <text x="250" y="80" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">Type</text>
    <rect x="320" y="55" width="180" height="40" fill="#273c66"/>
    <text x="410" y="80" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">Size</text>
    <rect x="500" y="55" width="200" height="40" fill="#273c66"/>
    <text x="600" y="80" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">Best for</text>

    <rect x="20" y="95" width="160" height="45" fill="#2a2a3e" stroke="#51cf66"/>
    <text x="100" y="123" text-anchor="middle" fill="#51cf66" font-weight="bold">useState</text>
    <rect x="180" y="95" width="140" height="45" fill="#2a2a3e" stroke="#51cf66"/>
    <text x="250" y="123" text-anchor="middle" fill="#ccc">Local</text>
    <rect x="320" y="95" width="180" height="45" fill="#2a2a3e" stroke="#51cf66"/>
    <text x="410" y="123" text-anchor="middle" fill="#ccc">0 KB (built-in)</text>
    <rect x="500" y="95" width="200" height="45" fill="#2a2a3e" stroke="#51cf66"/>
    <text x="600" y="123" text-anchor="middle" fill="#ccc">Simple local state</text>

    <rect x="20" y="140" width="160" height="45" fill="#2a2a3e" stroke="#4a9eff"/>
    <text x="100" y="168" text-anchor="middle" fill="#4a9eff" font-weight="bold">Context</text>
    <rect x="180" y="140" width="140" height="45" fill="#2a2a3e" stroke="#4a9eff"/>
    <text x="250" y="168" text-anchor="middle" fill="#ccc">Shared</text>
    <rect x="320" y="140" width="180" height="45" fill="#2a2a3e" stroke="#4a9eff"/>
    <text x="410" y="168" text-anchor="middle" fill="#ccc">0 KB (built-in)</text>
    <rect x="500" y="140" width="200" height="45" fill="#2a2a3e" stroke="#4a9eff"/>
    <text x="600" y="168" text-anchor="middle" fill="#ccc">Theme, auth, locale</text>

    <rect x="20" y="185" width="160" height="45" fill="#2a2a3e" stroke="#d19a66"/>
    <text x="100" y="213" text-anchor="middle" fill="#d19a66" font-weight="bold">Zustand</text>
    <rect x="180" y="185" width="140" height="45" fill="#2a2a3e" stroke="#d19a66"/>
    <text x="250" y="213" text-anchor="middle" fill="#ccc">Global</text>
    <rect x="320" y="185" width="180" height="45" fill="#2a2a3e" stroke="#d19a66"/>
    <text x="410" y="213" text-anchor="middle" fill="#ccc">~1 KB</text>
    <rect x="500" y="185" width="200" height="45" fill="#2a2a3e" stroke="#d19a66"/>
    <text x="600" y="213" text-anchor="middle" fill="#ccc">Cart, UI, app state</text>

    <rect x="20" y="230" width="160" height="45" fill="#2a2a3e" stroke="#ff6b6b"/>
    <text x="100" y="258" text-anchor="middle" fill="#ff6b6b" font-weight="bold">TanStack Query</text>
    <rect x="180" y="230" width="140" height="45" fill="#2a2a3e" stroke="#ff6b6b"/>
    <text x="250" y="258" text-anchor="middle" fill="#ccc">Server</text>
    <rect x="320" y="230" width="180" height="45" fill="#2a2a3e" stroke="#ff6b6b"/>
    <text x="410" y="258" text-anchor="middle" fill="#ccc">~13 KB</text>
    <rect x="500" y="230" width="200" height="45" fill="#2a2a3e" stroke="#ff6b6b"/>
    <text x="600" y="258" text-anchor="middle" fill="#ccc">API data, cache</text>

    <rect x="20" y="275" width="160" height="45" fill="#2a2a3e" stroke="#a78bfa"/>
    <text x="100" y="303" text-anchor="middle" fill="#a78bfa" font-weight="bold">Redux Toolkit</text>
    <rect x="180" y="275" width="140" height="45" fill="#2a2a3e" stroke="#a78bfa"/>
    <text x="250" y="303" text-anchor="middle" fill="#ccc">Global</text>
    <rect x="320" y="275" width="180" height="45" fill="#2a2a3e" stroke="#a78bfa"/>
    <text x="410" y="303" text-anchor="middle" fill="#ccc">~15 KB</text>
    <rect x="500" y="275" width="200" height="45" fill="#2a2a3e" stroke="#a78bfa"/>
    <text x="600" y="303" text-anchor="middle" fill="#ccc">Large enterprise</text>
  </table>

  <text x="360" y="345" text-anchor="middle" fill="#888" font-family="monospace" font-size="13">Start simple (useState) &#8594; add Zustand for global &#8594; TanStack Query for server state</text>
</svg>