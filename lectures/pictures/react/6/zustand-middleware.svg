<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360">
  <rect width="720" height="360" fill="#1e1e2e"/>

  <text x="360" y="35" text-anchor="middle" fill="#61DAFB" font-family="monospace" font-size="18" font-weight="bold">Zustand — middleware</text>

  <!-- persist -->
  <rect x="20" y="55" width="330" height="140" rx="8" fill="#1a1a2e" stroke="#4a9eff"/>
  <text x="40" y="80" fill="#4a9eff" font-family="monospace" font-size="14" font-weight="bold">persist &#8212; localStorage sync</text>
  <text x="40" y="105" fill="#ccc" font-family="monospace" font-size="12">import { persist } from "zustand/middleware"</text>
  <text x="40" y="130" fill="#d19a66" font-family="monospace" font-size="12">const useStore = create(persist(</text>
  <text x="50" y="148" fill="#d19a66" font-family="monospace" font-size="12">(set) =&gt; ({ theme: "light", ... }),</text>
  <text x="50" y="166" fill="#d19a66" font-family="monospace" font-size="12">{ name: "app-storage" }</text>
  <text x="40" y="184" fill="#d19a66" font-family="monospace" font-size="12">))</text>

  <!-- devtools -->
  <rect x="370" y="55" width="330" height="140" rx="8" fill="#1a1a2e" stroke="#51cf66"/>
  <text x="390" y="80" fill="#51cf66" font-family="monospace" font-size="14" font-weight="bold">devtools &#8212; Redux DevTools</text>
  <text x="390" y="105" fill="#ccc" font-family="monospace" font-size="12">import { devtools } from "zustand/middleware"</text>
  <text x="390" y="130" fill="#d19a66" font-family="monospace" font-size="12">const useStore = create(devtools(</text>
  <text x="400" y="148" fill="#d19a66" font-family="monospace" font-size="12">(set) =&gt; ({ ... }),</text>
  <text x="400" y="166" fill="#d19a66" font-family="monospace" font-size="12">{ name: "my-store" }</text>
  <text x="390" y="184" fill="#d19a66" font-family="monospace" font-size="12">))</text>

  <!-- Combined -->
  <rect x="20" y="215" width="680" height="130" rx="8" fill="#2a2a3e" stroke="#d19a66"/>
  <text x="40" y="240" fill="#d19a66" font-family="monospace" font-size="14" font-weight="bold">Комбінація middleware (persist + devtools):</text>
  <text x="40" y="265" fill="#ccc" font-family="monospace" font-size="12">const useStore = create(devtools(persist(</text>
  <text x="50" y="283" fill="#ccc" font-family="monospace" font-size="12">(set, get) =&gt; ({</text>
  <text x="60" y="300" fill="#d19a66" font-family="monospace" font-size="12">user: null, cart: [], login: (u) =&gt; set({ user: u }),</text>
  <text x="50" y="318" fill="#ccc" font-family="monospace" font-size="12">}),</text>
  <text x="60" y="335" fill="#d19a66" font-family="monospace" font-size="12">{ name: "app-store" }</text>
  <text x="40" y="340" fill="#ccc" font-family="monospace" font-size="12">)))</text>
</svg>