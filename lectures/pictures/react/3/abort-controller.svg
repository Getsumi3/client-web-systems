<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380">
  <rect width="720" height="380" fill="#1e1e2e"/>

  <text x="360" y="35" text-anchor="middle" fill="#61DAFB" font-family="monospace" font-size="18" font-weight="bold">AbortController — скасування запитів</text>

  <!-- Without -->
  <rect x="20" y="55" width="330" height="140" rx="8" fill="#1a1a2e" stroke="#ff6b6b"/>
  <text x="40" y="80" fill="#ff6b6b" font-family="monospace" font-size="13" font-weight="bold">&#10060; Без скасування (race condition)</text>
  <text x="40" y="105" fill="#ccc" font-family="monospace" font-size="12">useEffect(() =&gt; {</text>
  <text x="55" y="123" fill="#ccc" font-family="monospace" font-size="12">fetch(`/api?q=${query}`)</text>
  <text x="55" y="141" fill="#ccc" font-family="monospace" font-size="12">  .then(setData)</text>
  <text x="40" y="159" fill="#ccc" font-family="monospace" font-size="12">}, [query])</text>
  <text x="40" y="185" fill="#ff6b6b" font-family="monospace" font-size="11">// старий запит може перезаписати новий</text>

  <!-- With -->
  <rect x="370" y="55" width="330" height="140" rx="8" fill="#1a1a2e" stroke="#51cf66"/>
  <text x="390" y="80" fill="#51cf66" font-family="monospace" font-size="13" font-weight="bold">&#9989; З AbortController</text>
  <text x="390" y="105" fill="#ccc" font-family="monospace" font-size="12">useEffect(() =&gt; {</text>
  <text x="405" y="123" fill="#ccc" font-family="monospace" font-size="12">const ctrl = new AbortController()</text>
  <text x="405" y="141" fill="#ccc" font-family="monospace" font-size="12">fetch(url, { signal: ctrl.signal })</text>
  <text x="405" y="159" fill="#ccc" font-family="monospace" font-size="12">return () =&gt; ctrl.abort()</text>
  <text x="390" y="177" fill="#ccc" font-family="monospace" font-size="12">}, [query])</text>

  <!-- Axios version -->
  <rect x="20" y="210" width="680" height="155" rx="8" fill="#1a1a2e" stroke="#d19a66"/>
  <text x="40" y="235" fill="#d19a66" font-family="monospace" font-size="13" font-weight="bold">Axios варіант:</text>
  <text x="40" y="260" fill="#ccc" font-family="monospace" font-size="12">useEffect(() =&gt; {</text>
  <text x="60" y="278" fill="#ccc" font-family="monospace" font-size="12">const ctrl = new AbortController()</text>
  <text x="60" y="296" fill="#ccc" font-family="monospace" font-size="12">axios.get("/api/users", { signal: ctrl.signal })</text>
  <text x="60" y="314" fill="#ccc" font-family="monospace" font-size="12">  .then(res =&gt; setUsers(res.data))</text>
  <text x="60" y="332" fill="#ccc" font-family="monospace" font-size="12">  .catch(err =&gt; { if (!axios.isCancel(err)) setError(err) })</text>
  <text x="60" y="350" fill="#ccc" font-family="monospace" font-size="12">return () =&gt; ctrl.abort()</text>
  <text x="40" y="365" fill="#ccc" font-family="monospace" font-size="12">}, [])</text>
</svg>