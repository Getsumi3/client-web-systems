<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360">
  <rect width="720" height="360" fill="#1e1e2e"/>

  <text x="360" y="35" text-anchor="middle" fill="#61DAFB" font-family="monospace" font-size="18" font-weight="bold">Оптимістичні оновлення (Optimistic UI)</text>

  <!-- Pessimistic -->
  <rect x="20" y="55" width="330" height="140" rx="8" fill="#1a1a2e" stroke="#ff6b6b"/>
  <text x="40" y="80" fill="#ff6b6b" font-family="monospace" font-size="14" font-weight="bold">Песимістичний (звичайний)</text>
  <text x="40" y="105" fill="#ccc" font-family="monospace" font-size="12">1. User clicks "Delete"</text>
  <text x="40" y="123" fill="#ccc" font-family="monospace" font-size="12">2. Show spinner</text>
  <text x="40" y="141" fill="#ccc" font-family="monospace" font-size="12">3. Wait for server response...</text>
  <text x="40" y="159" fill="#ccc" font-family="monospace" font-size="12">4. Remove item from list</text>
  <text x="40" y="185" fill="#888" font-family="monospace" font-size="11">// UI затримується на час запиту</text>

  <!-- Optimistic -->
  <rect x="370" y="55" width="330" height="140" rx="8" fill="#1a1a2e" stroke="#51cf66"/>
  <text x="390" y="80" fill="#51cf66" font-family="monospace" font-size="14" font-weight="bold">Оптимістичний (швидкий UX)</text>
  <text x="390" y="105" fill="#ccc" font-family="monospace" font-size="12">1. User clicks "Delete"</text>
  <text x="390" y="123" fill="#ccc" font-family="monospace" font-size="12">2. Remove item from list INSTANTLY</text>
  <text x="390" y="141" fill="#ccc" font-family="monospace" font-size="12">3. Send request in background</text>
  <text x="390" y="159" fill="#ccc" font-family="monospace" font-size="12">4. If error &#8594; rollback (restore item)</text>
  <text x="390" y="185" fill="#888" font-family="monospace" font-size="11">// UI миттєво реагує</text>

  <!-- Code -->
  <rect x="20" y="210" width="680" height="135" rx="8" fill="#1a1a2e" stroke="#444"/>
  <text x="40" y="235" fill="#61DAFB" font-family="monospace" font-size="12" font-weight="bold">const deleteOptimistic = async (id: string) =&gt; {</text>
  <text x="60" y="255" fill="#ccc" font-family="monospace" font-size="12">const prev = items;                    // 1. save snapshot</text>
  <text x="60" y="273" fill="#ccc" font-family="monospace" font-size="12">setItems(items.filter(i =&gt; i.id !== id)); // 2. update UI now</text>
  <text x="60" y="291" fill="#ccc" font-family="monospace" font-size="12">try { await api.deleteUser(id); }       // 3. send request</text>
  <text x="60" y="309" fill="#ff6b6b" font-family="monospace" font-size="12">catch (e) { setItems(prev); showError(); } // 4. rollback on error</text>
  <text x="40" y="335" fill="#61DAFB" font-family="monospace" font-size="12">}</text>
</svg>