<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380">
  <rect width="720" height="380" fill="#1e1e2e"/>

  <text x="360" y="35" text-anchor="middle" fill="#61DAFB" font-family="monospace" font-size="18" font-weight="bold">CRUD-проблема: staleness та race conditions</text>

  <!-- Problem 1: stale list -->
  <rect x="20" y="55" width="340" height="150" rx="8" fill="#1a1a2e" stroke="#ff6b6b"/>
  <text x="40" y="80" fill="#ff6b6b" font-family="monospace" font-size="13" font-weight="bold">&#10060; 1. Stale list (список не оновлюється)</text>
  <text x="40" y="105" fill="#ccc" font-family="monospace" font-size="12">// create item</text>
  <text x="40" y="123" fill="#ccc" font-family="monospace" font-size="12">await axios.post("/api/users", data)</text>
  <text x="40" y="141" fill="#ccc" font-family="monospace" font-size="12">// &#10007; list still shows old data!</text>
  <text x="40" y="170" fill="#51cf66" font-family="monospace" font-size="12">&#9989; refetch after mutation:</text>
  <text x="40" y="188" fill="#51cf66" font-family="monospace" font-size="12">await create(); await refetchList()</text>

  <!-- Problem 2: race condition -->
  <rect x="380" y="55" width="320" height="150" rx="8" fill="#1a1a2e" stroke="#ff6b6b"/>
  <text x="400" y="80" fill="#ff6b6b" font-family="monospace" font-size="13" font-weight="bold">&#10060; 2. Race condition (запит-перегонка)</text>
  <text x="400" y="105" fill="#ccc" font-family="monospace" font-size="12">// user types "a" then "ab"</text>
  <text x="400" y="123" fill="#ccc" font-family="monospace" font-size="12">fetch("a") // slow</text>
  <text x="400" y="141" fill="#ccc" font-family="monospace" font-size="12">fetch("ab") // fast, returns first</text>
  <text x="400" y="159" fill="#ff6b6b" font-family="monospace" font-size="12">// "a" response overwrites!</text>
  <text x="400" y="185" fill="#51cf66" font-family="monospace" font-size="12">&#9989; AbortController / cancel flag</text>

  <!-- Problem 3: no error handling -->
  <rect x="20" y="220" width="340" height="140" rx="8" fill="#1a1a2e" stroke="#ff6b6b"/>
  <text x="40" y="245" fill="#ff6b6b" font-family="monospace" font-size="13" font-weight="bold">&#10060; 3. Корзина помилок без UI</text>
  <text x="40" y="270" fill="#ccc" font-family="monospace" font-size="12">axios.post(...) // без .catch</text>
  <text x="40" y="290" fill="#ff6b6b" font-family="monospace" font-size="12">// unhandled rejection</text>
  <text x="40" y="320" fill="#51cf66" font-family="monospace" font-size="12">&#9989; try/catch + setError + UI toast</text>

  <!-- Problem 4: double fetch -->
  <rect x="380" y="220" width="320" height="140" rx="8" fill="#1a1a2e" stroke="#ff6b6b"/>
  <text x="400" y="245" fill="#ff6b6b" font-family="monospace" font-size="13" font-weight="bold">&#10060; 4. Подвійний fetch (StrictMode)</text>
  <text x="400" y="270" fill="#ccc" font-family="monospace" font-size="12">// useEffect runs twice in dev</text>
  <text x="400" y="290" fill="#ccc" font-family="monospace" font-size="12">useEffect(() =&gt; fetch(), [])</text>
  <text x="400" y="310" fill="#ff6b6b" font-family="monospace" font-size="12">// 2 API calls in dev mode</text>
  <text x="400" y="335" fill="#51cf66" font-family="monospace" font-size="12">&#9989; cleanup fn / React 18 automatic</text>
</svg>