<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340">
  <rect width="720" height="340" fill="#1e1e2e"/>

  <!-- JSX code -->
  <rect x="20" y="20" width="320" height="300" rx="8" fill="#2a2a3e" stroke="#444"/>
  <text x="40" y="45" fill="#61DAFB" font-family="monospace" font-size="13" font-weight="bold">JSX (описуємо UI)</text>
  <text x="40" y="75" fill="#888" font-family="monospace" font-size="13">const el = (</text>
  <text x="60" y="95" fill="#e06c75" font-family="monospace" font-size="13">&lt;div</text>
  <text x="90" y="95" fill="#d19a66" font-family="monospace" font-size="13"> className="card"&gt;</text>
  <text x="80" y="115" fill="#e06c75" font-family="monospace" font-size="13">&lt;h1&gt;</text>
  <text x="110" y="115" fill="#98c379" font-family="monospace" font-size="13">Hello</text>
  <text x="150" y="115" fill="#e06c75" font-family="monospace" font-size="13">&lt;/h1&gt;</text>
  <text x="80" y="135" fill="#e06c75" font-family="monospace" font-size="13">&lt;p&gt;</text>
  <text x="100" y="135" fill="#98c379" font-family="monospace" font-size="13">{name}</text>
  <text x="145" y="135" fill="#e06c75" font-family="monospace" font-size="13">&lt;/p&gt;</text>
  <text x="60" y="155" fill="#e06c75" font-family="monospace" font-size="13">&lt;/div&gt;</text>
  <text x="40" y="195" fill="#888" font-family="monospace" font-size="13">);</text>

  <!-- Arrow -->
  <text x="365" y="170" text-anchor="middle" fill="#61DAFB" font-family="monospace" font-size="30">&#8651;</text>

  <!-- JS output -->
  <rect x="380" y="20" width="320" height="300" rx="8" fill="#2a2a3e" stroke="#444"/>
  <text x="400" y="45" fill="#4a9eff" font-family="monospace" font-size="13" font-weight="bold">React.createElement</text>
  <text x="400" y="75" fill="#888" font-family="monospace" font-size="12">const el =</text>
  <text x="400" y="95" fill="#e06c75" font-family="monospace" font-size="12">  React.createElement(</text>
  <text x="420" y="115" fill="#d19a66" font-family="monospace" font-size="12">"div",</text>
  <text x="420" y="135" fill="#d19a66" font-family="monospace" font-size="12">&#123; className: "card" &#125;,</text>
  <text x="420" y="155" fill="#e06c75" font-family="monospace" font-size="12">    React.createElement(</text>
  <text x="440" y="175" fill="#d19a66" font-family="monospace" font-size="12">"h1", null, "Hello"</text>
  <text x="420" y="195" fill="#e06c75" font-family="monospace" font-size="12">    ),</text>
  <text x="420" y="215" fill="#e06c75" font-family="monospace" font-size="12">    React.createElement(</text>
  <text x="440" y="235" fill="#d19a66" font-family="monospace" font-size="12">"p", null, name</text>
  <text x="420" y="255" fill="#e06c75" font-family="monospace" font-size="12">    )</text>
  <text x="400" y="275" fill="#e06c75" font-family="monospace" font-size="12">  );</text>

  <text x="360" y="330" text-anchor="middle" fill="#aaa" font-family="sans-serif" font-size="14">JSX — це синтаксичний цукор над викликами createElement</text>
</svg>
