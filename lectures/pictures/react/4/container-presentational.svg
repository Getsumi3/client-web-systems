<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420">
  <rect width="720" height="420" fill="#1e1e2e"/>

  <text x="360" y="35" text-anchor="middle" fill="#61DAFB" font-family="monospace" font-size="18" font-weight="bold">Container vs Presentational</text>

  <!-- Container -->
  <rect x="20" y="55" width="330" height="180" rx="8" fill="#1a1a2e" stroke="#4a9eff"/>
  <text x="40" y="80" fill="#4a9eff" font-family="monospace" font-size="14" font-weight="bold">Container (logic)</text>
  <text x="40" y="105" fill="#ccc" font-family="monospace" font-size="12">function UserListContainer() {</text>
  <text x="55" y="123" fill="#ccc" font-family="monospace" font-size="12">const { users, loading, error }</text>
  <text x="65" y="138" fill="#ccc" font-family="monospace" font-size="12">= useUsers();</text>
  <text x="55" y="160" fill="#ccc" font-family="monospace" font-size="12">if (loading) return &lt;Spinner /&gt;;</text>
  <text x="55" y="178" fill="#ccc" font-family="monospace" font-size="12">if (error) return &lt;ErrorView /&gt;;</text>
  <text x="55" y="200" fill="#ccc" font-family="monospace" font-size="12">return &lt;UserListView users={users}</text>
  <text x="65" y="215" fill="#ccc" font-family="monospace" font-size="12">onDelete={handleDelete} /&gt;;</text>
  <text x="40" y="230" fill="#ccc" font-family="monospace" font-size="12">}</text>

  <!-- Presentational -->
  <rect x="370" y="55" width="330" height="180" rx="8" fill="#1a1a2e" stroke="#51cf66"/>
  <text x="390" y="80" fill="#51cf66" font-family="monospace" font-size="14" font-weight="bold">Presentational (UI only)</text>
  <text x="390" y="105" fill="#ccc" font-family="monospace" font-size="12">function UserListView(props: {</text>
  <text x="405" y="123" fill="#ccc" font-family="monospace" font-size="12">users: User[];</text>
  <text x="405" y="141" fill="#ccc" font-family="monospace" font-size="12">onDelete: (id: string) =&gt; void;</text>
  <text x="390" y="159" fill="#ccc" font-family="monospace" font-size="12">}) {</text>
  <text x="405" y="177" fill="#ccc" font-family="monospace" font-size="12">return (</text>
  <text x="420" y="195" fill="#ccc" font-family="monospace" font-size="12">&lt;ul&gt;{users.map(u =&gt; ...)}&lt;/ul&gt;</text>
  <text x="405" y="213" fill="#ccc" font-family="monospace" font-size="12">);</text>
  <text x="390" y="230" fill="#ccc" font-family="monospace" font-size="12">}</text>

  <!-- Arrow between -->
  <text x="360" y="150" text-anchor="middle" fill="#61DAFB" font-family="monospace" font-size="20">props</text>
  <line x1="350" y1="160" x2="370" y2="160" stroke="#61DAFB" stroke-width="2" marker-end="url(#c1)"/>

  <!-- Bottom -->
  <rect x="20" y="255" width="680" height="145" rx="8" fill="#2a2a3e" stroke="#444"/>
  <text x="40" y="280" fill="#ccc" font-family="monospace" font-size="14" font-weight="bold">Container:</text>
  <text x="160" y="280" fill="#ccc" font-family="monospace" font-size="13">data fetching, state, business logic</text>
  <text x="40" y="305" fill="#ccc" font-family="monospace" font-size="14" font-weight="bold">Presentational:</text>
  <text x="180" y="305" fill="#ccc" font-family="monospace" font-size="13">pure UI, receives props, no side effects, reusable</text>
  <text x="40" y="345" fill="#888" font-family="monospace" font-size="12">Note: In modern React with Hooks, this pattern is less strict.</text>
  <text x="40" y="365" fill="#888" font-family="monospace" font-size="12">Custom Hooks extract logic instead of Container components.</text>
  <text x="40" y="385" fill="#888" font-family="monospace" font-size="12">Still useful for separating data-aware pages from reusable UI components.</text>

  <defs>
    <marker id="c1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#61DAFB"/>
    </marker>
  </defs>
</svg>