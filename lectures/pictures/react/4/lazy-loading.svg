<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340">
  <rect width="720" height="340" fill="#1e1e2e"/>

  <text x="360" y="35" text-anchor="middle" fill="#61DAFB" font-family="monospace" font-size="18" font-weight="bold">Lazy Loading Routes — code splitting</text>

  <!-- Without -->
  <rect x="20" y="55" width="330" height="120" rx="8" fill="#1a1a2e" stroke="#ff6b6b"/>
  <text x="40" y="80" fill="#ff6b6b" font-family="monospace" font-size="13" font-weight="bold">Без lazy — один бандл</text>
  <text x="40" y="105" fill="#ccc" font-family="monospace" font-size="12">import Home from "./Home";</text>
  <text x="40" y="123" fill="#ccc" font-family="monospace" font-size="12">import Users from "./Users";</text>
  <text x="40" y="141" fill="#ccc" font-family="monospace" font-size="12">import Settings from "./Settings";</text>
  <text x="40" y="165" fill="#ff6b6b" font-family="monospace" font-size="11">// all loaded upfront (~500KB)</text>

  <!-- With -->
  <rect x="370" y="55" width="330" height="120" rx="8" fill="#1a1a2e" stroke="#51cf66"/>
  <text x="390" y="80" fill="#51cf66" font-family="monospace" font-size="13" font-weight="bold">З lazy — split per route</text>
  <text x="390" y="105" fill="#ccc" font-family="monospace" font-size="12">const Home = lazy(() =&gt; import("./Home"));</text>
  <text x="390" y="123" fill="#ccc" font-family="monospace" font-size="12">const Users = lazy(() =&gt; import("./Users"));</text>
  <text x="390" y="141" fill="#ccc" font-family="monospace" font-size="12">const Settings = lazy(() =&gt; import("./Settings"));</text>
  <text x="390" y="165" fill="#51cf66" font-family="monospace" font-size="11">// each loaded on demand (~50KB)</text>

  <!-- Suspense -->
  <rect x="20" y="195" width="680" height="120" rx="8" fill="#2a2a3e" stroke="#d19a66"/>
  <text x="40" y="220" fill="#d19a66" font-family="monospace" font-size="14" font-weight="bold">Suspense — fallback під час завантаження</text>
  <text x="40" y="250" fill="#ccc" font-family="monospace" font-size="13">&lt;Suspense fallback={&lt;Spinner /&gt;}&gt;</text>
  <text x="60" y="270" fill="#ccc" font-family="monospace" font-size="13">&lt;Routes&gt;...&lt;/Routes&gt;</text>
  <text x="40" y="290" fill="#ccc" font-family="monospace" font-size="13">&lt;/Suspense&gt;</text>
  <text x="40" y="310" fill="#888" font-family="monospace" font-size="12">// показує spinner поки chunk завантажується</text>
</svg>