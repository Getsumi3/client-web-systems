<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380">
  <rect width="720" height="380" fill="#1e1e2e"/>

  <text x="360" y="35" text-anchor="middle" fill="#61DAFB" font-family="monospace" font-size="18" font-weight="bold">Component Composition — патерни</text>

  <!-- Pattern 1: children -->
  <rect x="20" y="55" width="220" height="145" rx="8" fill="#1a1a2e" stroke="#4a9eff"/>
  <text x="40" y="80" fill="#4a9eff" font-family="monospace" font-size="12" font-weight="bold">1. children prop</text>
  <text x="40" y="105" fill="#ccc" font-family="monospace" font-size="11">&lt;Card&gt;</text>
  <text x="55" y="123" fill="#ccc" font-family="monospace" font-size="11">&lt;h2&gt;Title&lt;/h2&gt;</text>
  <text x="55" y="141" fill="#ccc" font-family="monospace" font-size="11">&lt;p&gt;Content&lt;/p&gt;</text>
  <text x="40" y="159" fill="#ccc" font-family="monospace" font-size="11">&lt;/Card&gt;</text>
  <text x="40" y="185" fill="#888" font-family="monospace" font-size="10">// Card = layout wrapper</text>

  <!-- Pattern 2: render props -->
  <rect x="260" y="55" width="220" height="145" rx="8" fill="#1a1a2e" stroke="#d19a66"/>
  <text x="280" y="80" fill="#d19a66" font-family="monospace" font-size="12" font-weight="bold">2. render props</text>
  <text x="280" y="105" fill="#ccc" font-family="monospace" font-size="11">&lt;DataProvider render={data =&gt;</text>
  <text x="295" y="123" fill="#ccc" font-family="monospace" font-size="11">&lt;List items={data} /&gt;</text>
  <text x="280" y="141" fill="#ccc" font-family="monospace" font-size="11">} /&gt;</text>
  <text x="280" y="185" fill="#888" font-family="monospace" font-size="10">// function as child</text>

  <!-- Pattern 3: compound -->
  <rect x="500" y="55" width="200" height="145" rx="8" fill="#1a1a2e" stroke="#51cf66"/>
  <text x="520" y="80" fill="#51cf66" font-family="monospace" font-size="12" font-weight="bold">3. compound components</text>
  <text x="520" y="105" fill="#ccc" font-family="monospace" font-size="11">&lt;Tabs&gt;</text>
  <text x="535" y="123" fill="#ccc" font-family="monospace" font-size="11">&lt;Tabs.List&gt;...&lt;/Tabs.List&gt;</text>
  <text x="535" y="141" fill="#ccc" font-family="monospace" font-size="11">&lt;Tabs.Panel&gt;...&lt;/Tabs.Panel&gt;</text>
  <text x="520" y="159" fill="#ccc" font-family="monospace" font-size="11">&lt;/Tabs&gt;</text>
  <text x="520" y="185" fill="#888" font-family="monospace" font-size="10">// shared state implicitly</text>

  <!-- Pattern 4: HOC -->
  <rect x="20" y="220" width="220" height="135" rx="8" fill="#1a1a2e" stroke="#ff6b6b"/>
  <text x="40" y="245" fill="#ff6b6b" font-family="monospace" font-size="12" font-weight="bold">4. HOC (legacy)</text>
  <text x="40" y="270" fill="#ccc" font-family="monospace" font-size="11">function withAuth(Component) {</text>
  <text x="55" y="288" fill="#ccc" font-family="monospace" font-size="11">return props =&gt; {</text>
  <text x="70" y="306" fill="#ccc" font-family="monospace" font-size="11">if (!auth) return &lt;Login /&gt;;</text>
  <text x="70" y="324" fill="#ccc" font-family="monospace" font-size="11">return &lt;Component {...props} /&gt;;</text>
  <text x="55" y="342" fill="#ccc" font-family="monospace" font-size="11">}}</text>

  <!-- Pattern 5: hooks -->
  <rect x="260" y="220" width="220" height="135" rx="8" fill="#1a1a2e" stroke="#61DAFB"/>
  <text x="280" y="245" fill="#61DAFB" font-family="monospace" font-size="12" font-weight="bold">5. Custom Hooks (modern)</text>
  <text x="280" y="270" fill="#ccc" font-family="monospace" font-size="11">function Page() {</text>
  <text x="295" y="288" fill="#ccc" font-family="monospace" font-size="11">const { data, loading } =</text>
  <text x="305" y="306" fill="#ccc" font-family="monospace" font-size="11">useAuth();</text>
  <text x="295" y="324" fill="#ccc" font-family="monospace" font-size="11">if (!data) return &lt;Login /&gt;;</text>
  <text x="280" y="342" fill="#ccc" font-family="monospace" font-size="11">}</text>

  <!-- Pattern 6: slots via props -->
  <rect x="500" y="220" width="200" height="135" rx="8" fill="#1a1a2e" stroke="#d19a66"/>
  <text x="520" y="245" fill="#d19a66" font-family="monospace" font-size="12" font-weight="bold">6. slot props</text>
  <text x="520" y="270" fill="#ccc" font-family="monospace" font-size="11">&lt;Layout</text>
  <text x="535" y="288" fill="#ccc" font-family="monospace" font-size="11">header={&lt;Header /&gt;}</text>
  <text x="535" y="306" fill="#ccc" font-family="monospace" font-size="11">sidebar={&lt;Nav /&gt;}</text>
  <text x="535" y="324" fill="#ccc" font-family="monospace" font-size="11">&gt;</text>
  <text x="535" y="342" fill="#ccc" font-family="monospace" font-size="11">{children}&lt;/Layout&gt;</text>
</svg>